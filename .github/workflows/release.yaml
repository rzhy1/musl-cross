name: Auto Update Submodules & Release

on:
  schedule:
    - cron: '0 1 * * *' 
  workflow_dispatch:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  release:
    types:
      - released

jobs:

  # -----------------------------
  # 1. 更新子模块
  # -----------------------------
  update_submodules:
    name: Auto Update Submodules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Force update submodules
        run: |
          git submodule foreach --recursive 'git reset --hard'
          git submodule update --init --remote --force --recursive
          git add builder
          
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "GitHub Actions"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Auto-update builder submodule"
            git push
          else
            echo "No changes to commit"
          fi


  # -----------------------------
  # 2. 构建 + Release（必须等待更新子模块）
  # -----------------------------
  build_and_release:
    name: Build & Release
    runs-on: ubuntu-latest
    needs: update_submodules

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true

      - name: Repair Runner Node.js Externals
        run: |
          set -euo pipefail

          RUNNER_VERSION="2.338.2"
          RUNNER_ROOT="/home/runner/actions-runner"
          NODE24_PATH="${RUNNER_ROOT}/externals/node24/bin/node"

          echo "===== 检查当前 node24 状态 ====="
          if [ -x "${NODE24_PATH}" ]; then
            "${NODE24_PATH}" --version
            echo "node24 可执行文件存在，无需修复。"
            exit 0
          fi

          echo "node24 缺失或不可执行，开始从官方 tarball 修复..."

          # 下载官方 runner 包（与你版本一致）
          TMP_DIR="$(mktemp -d)"
          TARBALL="${TMP_DIR}/runner.tar.gz"
          curl -fsSL -o "${TARBALL}" \
            "https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz"

          # 备份损坏的 externals（不删除，便于事后排查）
          if [ -d "${RUNNER_ROOT}/externals" ]; then
            mv "${RUNNER_ROOT}/externals" "${RUNNER_ROOT}/externals.bak.$(date +%s)"
          fi

          # 只提取 tarball 中的 externals 目录到 Runner 根目录
          tar -xzf "${TARBALL}" -C "${RUNNER_ROOT}" externals

          # 验证修复结果
          echo "===== 修复后的 node24 版本 ====="
          "${NODE24_PATH}" --version

          # 清理临时文件
          rm -rf "${TMP_DIR}"
          
      - name: Build
        run: |
          sudo rm -rf /opt/*
          ./scripts/make x86_64-w64-mingw32

      - name: Diagnose Runner Node environment
        if: always()
        continue-on-error: true
        run: |
          echo "===== 当前工作目录 ====="
          pwd
          echo "===== 查找 actions-runner 安装目录 ====="
          find / -maxdepth 6 -type d -name "actions-runner" 2>/dev/null || true
          echo "===== 默认路径下的 externals ====="
          ls -la /home/runner/actions-runner/externals/ 2>&1 || true
          echo "===== node24 可执行文件 ====="
          ls -la /home/runner/actions-runner/externals/node24/bin/ 2>&1 || true
          echo "===== 系统 node 情况 ====="
          which node || true
          node --version || true
          echo "===== 相关环境变量 ====="
          env | grep -iE "runner|actions|node" || true
      - name: Find build.log
        if: failure()
        run: |
          echo "查找 build.log 文件..."
          find . -name "build.log" -print
          echo "--- build.log 文件内容 (如果找到): ---"
          find . -name "build.log" -print -exec cat {} \;
          if ! find . -name "build.log" -print -quit > /dev/null 2>&1; then
            echo "没有找到 build.log 文件。"
          fi

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: x86_64-w64-mingw32-1.tar.xz
          path: x86_64-w64-mingw32-1.tar.xz
          if-no-files-found: error
          retention-days: 1

      - name: Upload checksum
        uses: actions/upload-artifact@v7
        with:
          name: x86_64-w64-mingw32-1.tar.xz.sha256
          path: x86_64-w64-mingw32-1.tar.xz.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: mingw-w64
          name: mingw-w64 by musl-cross(crosstool-ng)
          allowUpdates: true
          artifacts: x86_64-w64-mingw32-1.tar.xz
          token: ${{ secrets.GITHUB_TOKEN }}
